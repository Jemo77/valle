<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Un valle personal: mangas traducidos, un lienzo para dibujar en compañía, proyectos en crecimiento y salas para leer en grupo.">
<meta name="theme-color" content="#09120f">
<title>Valle Interior</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chivo+Mono:wght@400;500&family=Shippori+Mincho:wght@500;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<link rel="stylesheet" href="/assets/valle.css">
</head>
<body>
<!--shell:start-->
<div id="sky" aria-hidden="true"></div>
<canvas id="stars" aria-hidden="true"></canvas>
<canvas id="far" aria-hidden="true"></canvas>
<canvas id="life" aria-hidden="true"></canvas>
<div class="grain" aria-hidden="true"></div>
<div class="vignette" aria-hidden="true"></div>
<svg id="ring" viewBox="-500 -500 1000 1000" aria-hidden="true"></svg>
<div class="frame" aria-hidden="true"><i class="c1"></i><i class="c2"></i><i class="c3"></i><i class="c4"></i><i class="ruler"></i></div>
<canvas id="front" aria-hidden="true"></canvas>

<div id="app">
  <header class="top">
    <div class="brand">
      <svg class="sigil" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="16" cy="16" r="13"/><path d="M16 25V13"/><path d="M16 18c-4 0-6-2-6-5 4 0 6 2 6 5z"/><path d="M16 16c3 0 5-2 5-5-3 0-5 2-5 5z"/></svg>
      <div><b id="site-name">Valle Interior</b><small>puesto de observación</small></div>
    </div>
    <div class="top-r">
      <span class="pop on"><i aria-hidden="true"></i>en el valle <b id="pop">1</b></span>
      <span id="clock">--:--</span>
      <span id="acct-slot"></span>
    </div>
  </header>

  <div class="main">
    <nav class="selector" role="tablist" aria-label="Qué querés hacer" aria-orientation="vertical" id="selector">
      <p class="sel-h">Elegí</p>
    </nav>
    <main class="stage">
      <section class="panel" id="panel" role="tabpanel" data-mod="inicio">
        <div class="ph"><span id="ph-l">Cargando</span><span class="st"><i class="dot"></i><span id="ph-st">abierto</span></span></div>
        <div class="pb" id="pb"><div class="loading">Abriendo el valle</div></div>
      </section>
    </main>
  </div>
</div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<!--shell:end-->

<script src="/assets/core.js"></script>
<script src="/assets/scene.js"></script>
<script src="/assets/api-rest.js"></script>
<script src="/assets/reader.js"></script>
<script src="/assets/canvas.js"></script>
<script src="/assets/mod-inicio.js"></script>
<script src="/assets/mod-leer.js"></script>
<script src="/assets/mod-dibujar.js"></script>
<script src="/assets/mod-proyectos.js"></script>
<script src="/assets/mod-salas.js"></script>
<script src="/assets/mod-notas.js"></script>
<script src="/assets/app.js"></script>
</body>
</html>
